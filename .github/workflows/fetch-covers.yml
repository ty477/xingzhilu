name: 抓取实拍封面

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-covers
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch cover photos from Wikimedia Commons
        run: python .github/scripts/fetch_covers.py
